services:
  gws:
    build:
      context: ./cli
      dockerfile: Dockerfile
    image: googleworkspace-cli
    volumes:
      # Persist gws config and credentials across runs
      - gws-config:/config/gws
      # Mount local working directory for file operations (uploads, downloads)
      - ./working_dir:/workspace
    environment:
      # Optional: override with a credentials file path inside the container
      # GOOGLE_WORKSPACE_CLI_CREDENTIALS_FILE: /config/gws/client_secret.json
      #
      # Optional: skip login by providing a pre-obtained access token
      # GOOGLE_WORKSPACE_CLI_TOKEN: your_token_here
      #
      # Load from a .env file if present (gws picks it up automatically)
      GOOGLE_WORKSPACE_CLI_CONFIG_DIR: /config/gws
    stdin_open: true
    tty: true

  pinchtab:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: pinchtab-server
    ports:
      - "127.0.0.1:9867:9867"
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:5901:5900"
    environment:
      - DISPLAY=:99
      - PINCHTAB_CONFIG=/config/pinchtab_config.json
    env_file:
      - ../.env
    volumes:
      - pinchtab-data:/data
      - ./mcp/pinchtab:/config/
    user: root
    shm_size: 2gb
    devices:
      - /dev/dri:/dev/dri

  ms-todo-auth:
    build:
      context: ./mcp/microsoft-todo
      dockerfile: auth.Dockerfile
    image: ms-todo-auth
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./working_dir/ms_todo.env
    environment:
      REDIRECT_URI: http://localhost:3000/callback
    volumes:
      - ./working_dir:/tokens
    profiles: ["auth"]

volumes:
  gws-config:
  pinchtab-data:
